<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Stanislav Sorokin — CV</title>
    <meta name="description" content="Download Stanislav Sorokin's CV as a PDF." />
    <style>
      :root { color-scheme: light; --ink:#10120f; --paper:#f1f0ea; --dark:#171a16; --accent:#d8ff3e; --muted:#63675f; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--ink); background: radial-gradient(circle at top, #fbf8f1, #eae5d8 58%, #d8d2c5); }
      main { min-height: 100%; display: grid; place-items: center; padding: 32px; }
      .card { width: min(720px, 100%); padding: 34px; border: 1px solid rgba(16,18,15,.12); border-radius: 28px; background: rgba(255,255,255,.7); box-shadow: 0 24px 80px rgba(16,18,15,.12); backdrop-filter: blur(18px); }
      .eyebrow { margin: 0 0 16px; color: var(--muted); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(34px, 5vw, 58px); line-height: .98; letter-spacing: -.05em; }
      p { margin: 18px 0 0; max-width: 60ch; font-size: 18px; line-height: 1.55; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      .button { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0 20px; border-radius: 999px; text-decoration: none; font-weight: 700; }
      .button--primary { color: var(--accent); background: var(--dark); }
      .button--secondary { color: var(--ink); border: 1px solid rgba(16,18,15,.18); background: rgba(255,255,255,.65); }
      .meta { margin-top: 20px; color: var(--muted); font-size: 13px; }
      .file { display: block; margin-top: 10px; font-size: 14px; word-break: break-all; }
      .hint { margin-top: 18px; font-size: 14px; color: var(--muted); }
      @media (max-width: 640px) { main { padding: 18px; } .card { padding: 24px; border-radius: 22px; } p { font-size: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">Curriculum vitae</p>
        <h1 id="title">Stanislav Sorokin</h1>
        <p>Senior Unity Developer and Technical Lead. Download the PDF CV below.</p>
        <div class="actions">
          <a id="download" class="button button--primary" href="/cv/Stanislav_Sorokin_CV.pdf" download>Download CV</a>
          <a class="button button--secondary" href="/" rel="home">Back to portfolio</a>
        </div>
        <div class="meta">
          <span>PDF file</span>
          <span class="file">/cv/Stanislav_Sorokin_CV.pdf</span>
        </div>
        <p class="hint">If the download does not start automatically, use the Download CV button.</p>
      </section>
    </main>
    <script>
      const link = document.getElementById('download');
      setTimeout(() => link?.click(), 300);
    </script>
  </body>
</html>
